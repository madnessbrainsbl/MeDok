# Собираем под Windows 7: у неё на рабочем месте именно она.
#
# Rust с 1.78 собирает обычный x86_64-pc-windows-msvc под Windows 10 —
# стандартная библиотека статически импортирует GetSystemTimePreciseAsFileTime,
# WaitOnAddress и ProcessPrng, которых в kernel32 семёрки нет, и exe не
# запускается вовсе: «Точка входа в процедуру … не найдена».
#
# Цель *-win7-* внутри std берёт старые вызовы (GetSystemTimeAsFileTime,
# SRWLock, RtlGenRandom). Она tier 3, готовой std под неё нет — отсюда
# nightly и -Z build-std. Сборка на каждый день:
#
#   cargo +nightly build --release --target x86_64-win7-windows-msvc -Z build-std=std,panic_abort
#
# Такой exe работает и на 10/11 — сборок две не нужно, нужна одна, эта.
#
# Статический CRT: иначе exe требует VCRUNTIME140.dll из VC++ Redistributable,
# которого на чистой машине может не быть. Просили «один exe без костылей».
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-win7-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
